[notes]
# Durable, non-obvious context only (like the examples below). If a note would
# change when the implementation changes, replace it with a pointer to the file
# that owns that behavior — the index is navigation (what/where), not a copy of
# the code's behavior (how).
# Important information that doesn't fit elsewhere:
# "This project is in migration from X to Y"
# "Legacy code in old/ should not be modified"
# "Performance is critical - avoid N+1 queries"
