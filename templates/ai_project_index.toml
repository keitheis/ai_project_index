# ai_project_index.toml
# AI-friendly codebase index for efficient token usage
# Generated by: https://github.com/keitheis/ai_project_index
#
# This index is NAVIGATION, not behavior: it captures WHAT each module does and
# WHERE each concern lives. The code is the source of truth for HOW — keep
# step-by-step recipes out of these files (they rot); point to the owning
# file/module (or a co-located CLAUDE.md) instead.

[meta]
# High-level project overview
name = "{{PROJECT_NAME}}"
roots = [{{ROOT_FOLDERS}}]  # Root folders to analyze (e.g., ["src", "lib"] or ["."] for single root)
description = "TODO: Describe what this project does"
language = "TODO"          # e.g., Python, TypeScript, Go, Rust, Dart, Java, C++
framework = "TODO"         # e.g., Django, React, FastAPI, Flutter, Spring Boot, or "none"
architecture = "TODO"      # e.g., Monolith, Microservices, Clean Architecture, MVC, DDD

[structure]
# Document the folder organization
source = ""                # Main source folder (e.g., src/, lib/, app/)
modules = ""               # Features/modules folder (e.g., src/modules/, lib/features/)
tests = ""                 # Test folder (e.g., tests/, __tests__/, spec/)
config = ""                # Configuration files location
docs = ""                  # Documentation folder
scripts = ""               # Build/utility scripts

[modules]
# Reference to detailed module documentation
#
# Example:
# core = "modules/core.toml"
# auth = "modules/auth.toml"
# users = "modules/users.toml"
# payments = "modules/payments.toml"

[entry_points]
# Main files that start or configure the application
# main = ""                # Main entry file (e.g., main.py, index.ts, main.go)
# config = ""              # Main config file
# routes = ""              # API routes definition
# cli = ""                 # CLI entry point (if applicable)

[commands]
# Important commands for development workflow
# install = ""             # Install dependencies (e.g., npm install, pip install -r requirements.txt)
# build = ""               # Build the project
# dev = ""                 # Start development server
# test = ""                # Run tests
# lint = ""                # Run linter
# format = ""              # Format code
# deploy = ""              # Deploy command

[dependencies.policy]
# Architectural rules for dependencies
allowed = [
    "modules -> core (one-way dependency)",
    "any -> shared utilities",
]
forbidden = [
    "core -> modules (core should not depend on specific modules)",
    "circular dependencies between modules",
]

[dependencies.external]
# Key third-party libraries and their purpose
#
# Example:
# "requests" = "HTTP client"
# "pydantic" = "Data validation"
# "react" = "UI framework"
# "express" = "Web server"

[conventions]
# Project-specific patterns and rules for AI to follow
#
# naming = "snake_case for functions, PascalCase for classes"
# imports = "absolute imports only"
# error_handling = "use Result type, avoid exceptions for flow control"
# testing = "co-located tests in __tests__/ folders"

[conventions.patterns]
# Durable rules only (like the examples below). Do NOT put step-by-step recipes
# or call sequences here — that "how" belongs in the code; point to the owning
# file/module instead. Recipes rot; pointers don't.
# Example patterns AI should follow:
# "Use dependency injection for services"
# "All API routes must have input validation"
# "Database access only through repository layer"

[conventions.files]
# Example file naming conventions:
# component = "*.component.tsx"
# service = "*.service.ts"
# test = "*.test.ts"
# model = "*_model.py"

# [[component]]
# For larger projects, move this to modules/core.toml
# name = "Logger"
# file = "src/utils/logger.ts"
# purpose = "Centralized logging utility"
# exports = ["logger", "setupLogger"]
# description = """
# Provides structured logging with levels (debug, info, warn, error).
# Automatically includes timestamps and context.
# """

# [[component]]
# name = "HttpClient"
# file = "src/utils/http.ts"
# purpose = "HTTP client wrapper with error handling"
