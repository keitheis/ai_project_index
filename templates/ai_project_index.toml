# ai_project_index.toml
# AI-friendly codebase index for efficient navigation and grounding
# Generated by: https://github.com/keitheis/ai_project_index

[meta]
# High-level project overview — read this first for orientation
name = "{{PROJECT_NAME}}"
roots = [{{ROOT_FOLDERS}}]  # Root folders to analyze (e.g., ["src", "lib"] or ["."])
description = "TODO: One sentence — what this project does and for whom"
last_updated = "TODO: YYYY-MM-DD"

[meta.tech]
# Core technology stack — helps AI choose correct idioms
language = "TODO"          # e.g., Python 3.12, TypeScript 5.x, Go 1.22, Rust
framework = "TODO"         # e.g., Django 5.0, Next.js 15, FastAPI, Flutter, or "none"
architecture = "TODO"      # e.g., Monolith, Microservices, Clean Architecture, MVC, DDD

[structure]
# Map of folder organization — AI reads this to decide where to look
source = ""                # Main source folder (e.g., src/, lib/, app/)
modules = ""               # Features/modules folder (e.g., src/modules/, lib/features/)
tests = ""                 # Test folder (e.g., tests/, __tests__/, spec/)
config = ""                # Configuration files location
docs = ""                  # Documentation folder
scripts = ""               # Build/utility scripts

[modules]
# References to detailed module TOML files — the "table of contents"
# AI reads this to find the right module, then drills into that file.
#
# core = "modules/core.toml"
# auth = "modules/auth.toml"
# users = "modules/users.toml"
# payments = "modules/payments.toml"

[entry_points]
# Main files that start or configure the application
# AI reads these first when tracing execution flow
# main = ""                # Main entry file (e.g., main.py, index.ts, main.go)
# config = ""              # Main config file
# routes = ""              # API routes definition
# cli = ""                 # CLI entry point (if applicable)

[commands]
# Development workflow commands — AI uses these for build/test/deploy tasks
# install = ""             # Install dependencies
# build = ""               # Build the project
# dev = ""                 # Start development server
# test = ""                # Run tests
# lint = ""                # Run linter
# format = ""              # Format code
# deploy = ""              # Deploy command

[boundaries]
# Architectural rules that AI must respect when making changes.
# Violations of these boundaries are bugs, not style issues.
allowed = [
    # "modules -> core (one-way dependency)",
    # "any -> shared utilities",
]
forbidden = [
    # "core -> modules (core must not depend on feature modules)",
    # "circular dependencies between modules",
    # "direct database access outside repository layer",
]

[dependencies.external]
# Key third-party libraries and their purpose
# AI uses this to understand available tools and avoid introducing duplicates
#
# "requests" = "HTTP client"
# "pydantic" = "Data validation"
# "react" = "UI framework"
# "express" = "Web server"

[gotchas]
# Things that surprise newcomers (human or AI) — prevents costly mistakes
# Format: short label = "explanation"
#
# "env_vars" = "DATABASE_URL must be set before import; app crashes silently otherwise"
# "migration_order" = "Always run auth migrations before user migrations"
# "legacy_api" = "Routes in /v1/ use a different auth scheme — do not mix with /v2/"
# "no_orm" = "Raw SQL only; do not introduce an ORM"

[change_risk]
# Areas where changes are likely to cause cascading failures
# AI should be extra careful and read more context before modifying these
#
# high = ["src/core/auth.py", "src/db/migrations/", "config/settings.py"]
# moderate = ["src/api/routes/"]
# stable = ["src/utils/"]  # Safe to modify, few dependents

[conventions]
# Project-specific patterns and rules for AI to follow
#
# naming = "snake_case for functions, PascalCase for classes"
# imports = "absolute imports only"
# error_handling = "use Result type, avoid exceptions for flow control"
# testing = "co-located tests in __tests__/ folders"

[conventions.patterns]
# Patterns AI should consistently follow:
# "Use dependency injection for services"
# "All API routes must have input validation"
# "Database access only through repository layer"

[conventions.files]
# File naming conventions:
# component = "*.component.tsx"
# service = "*.service.ts"
# test = "*.test.ts"
# model = "*_model.py"

# [[component]]
# For smaller projects, define key components inline.
# For larger projects, move these to modules/*.toml files.
# name = "Logger"
# file = "src/utils/logger.ts"
# purpose = "Centralized logging utility"
# exports = ["logger", "setupLogger"]

[notes]
# Additional context that doesn't fit elsewhere:
# "This project is in migration from X to Y — see docs/migration.md"
# "Legacy code in old/ should not be modified"
# "Performance-critical — avoid N+1 queries"
